[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "camwosa-mcp"
version = "0.1.0"
description = "MCP-Server fuer CAMWOSA"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.0",
    "fastmcp>=2.0",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.scripts]
camwosa-mcp = "camwosa_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["camwosa_mcp*"]
